name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Runs dependency build scripts, so it gets a read-only token that is not kept in the checkout.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' server/spacetimedb/Cargo.toml | cut -d'"' -f2)
          upm=$(python3 -c "import json;print(json.load(open('unity/com.yevhenii.purser/package.json'))['version'])")
          sdk=$(grep -m1 'const string Version' unity/com.yevhenii.purser/Runtime/Billing.cs | cut -d'"' -f2)
          echo "tag=$tag crate=$crate upm=$upm sdk=$sdk"
          [ "$tag" = "$crate" ] && [ "$tag" = "$upm" ] && [ "$tag" = "$sdk" ] || { echo "::error::Tag v$tag does not match Cargo.toml ($crate) / package.json ($upm) / PurserInfo.Version ($sdk)"; exit 1; }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Build module
        working-directory: server
        run: cargo build -p purser --target wasm32-unknown-unknown --release --locked
      - name: Package
        run: |
          mkdir dist
          cp server/target/wasm32-unknown-unknown/release/purser.wasm dist/
          (cd dist && sha256sum purser.wasm > purser.wasm.sha256)
          (cd server && zip -qr ../dist/seed.example.zip seed.example seed.py stdb.py migrate.py spacetime.example.json)
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
