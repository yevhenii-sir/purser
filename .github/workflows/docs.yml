name: Docs

# Builds the MkDocs site from docs/ (strict mode fails on broken links) plus the admin panel demo
# (server/admin-ui, `npm run build:demo`, served at /demo/) and, on pushes to main,
# deploys it to GitHub Pages when the repository variable DOCS_PAGES is "true".
# To turn deploys on: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# (needs a public repository or a paid plan), then Settings -> Secrets and variables -> Actions ->
# Variables -> DOCS_PAGES = true.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "server/admin-ui/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "server/admin-ui/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a started Pages deployment finish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.8.1"
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/admin-ui/package-lock.json
      - name: Admin panel demo
        working-directory: server/admin-ui
        run: |
          npm ci
          npm run build:demo
          mkdir -p ../../site/demo
          cp dist-demo/index.html ../../site/demo/index.html
      - name: OpenAPI document is valid
        run: |
          pip install "openapi-spec-validator==0.9.0"
          openapi-spec-validator docs/openapi.yaml
      - if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
