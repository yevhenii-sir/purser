name: Docs

# Builds the MkDocs site from docs/ (strict mode fails on broken links) plus the admin panel demo
# (server/admin-ui, `npm run build:demo`, served at /demo/) and, on pushes to main,
# deploys it to GitHub Pages when the repository variable DOCS_PAGES is "true".
# To turn deploys on: Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# (needs a public repository or a paid plan), then Settings -> Secrets and variables -> Actions ->
# Variables -> DOCS_PAGES = true.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "server/admin-ui/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "server/admin-ui/**"
      - "mkdocs.yml"
      - "tools/mkdocs_hooks.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Let a started Pages deployment finish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mkdocs==1.6.1" "mkdocs-material==9.8.1"
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/admin-ui/package-lock.json
      - name: Admin panel demo
        working-directory: server/admin-ui
        run: |
          npm ci
          npm run build:demo
          mkdir -p ../../site/demo
          cp dist-demo/index.html ../../site/demo/index.html
      - name: OpenAPI document is valid
        run: |
          pip install "openapi-spec-validator==0.9.0"
          openapi-spec-validator docs/openapi.yaml
      - if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
