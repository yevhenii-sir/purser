name: Audit

# Known vulnerabilities in the dependencies, weekly and on lockfile changes. Separate from CI: a new
# advisory must not block every push. The Rust check covers what ships (the module's wasm, see
# server/deny.toml); the whole lockfile, test-only SpacetimeDB host included, is listed for reference.
on:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: ["server/Cargo.lock", "server/deny.toml", "server/admin-ui/package-lock.json", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo deny (the module's wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo install cargo-deny --locked
      - run: cargo deny check advisories

  rust-all:
    name: cargo audit (whole lockfile, for reference)
    runs-on: ubuntu-latest
    # Mostly the SpacetimeDB host the native tests run on, at the versions SpacetimeDB pins.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file server/Cargo.lock

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/admin-ui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm audit --audit-level=high --omit=dev
