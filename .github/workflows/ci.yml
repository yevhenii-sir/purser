name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs it on the tagged commit first.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  core:
    name: purser-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo test -p purser-core --locked

  module:
    name: module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo test -p purser --locked
      # Same build: no warnings in any crate (tests included).
      - run: cargo clippy -p purser-core -p purser -p purser-game-receiver --all-targets --locked -- -D warnings

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo build -p purser -p purser-game-receiver --target wasm32-unknown-unknown --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: purser.wasm
          path: |
            server/target/wasm32-unknown-unknown/release/purser.wasm
            server/target/wasm32-unknown-unknown/release/purser_game_receiver.wasm

  e2e:
    name: end to end on SpacetimeDB
    needs: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: purser.wasm
          path: wasm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # The version the module is built with (server/spacetimedb/Cargo.toml).
      - name: SpacetimeDB server
        run: docker run -d --name stdb -p 127.0.0.1:3000:3000 clockworklabs/spacetime:v2.16.3 start --listen-addr 0.0.0.0:3000
      - run: python tools/e2e.py --server http://127.0.0.1:3000 --wasm wasm/purser.wasm --game-wasm wasm/purser_game_receiver.wasm
      - name: Server log
        if: failure()
        run: docker logs stdb | tail -200

  admin-ui:
    name: admin page build is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: The demo build works
        run: npm run build:demo
      - name: The committed page matches the sources
        run: git diff --exit-code -- ../spacetimedb/admin/index.html ../spacetimedb/admin/csp.txt || { echo "::error::Run 'npm run build' in server/admin-ui and commit server/spacetimedb/admin/index.html and csp.txt"; exit 1; }

  sdks:
    name: SDKs for other engines
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: TypeScript
        working-directory: sdks/typescript
        run: npm ci && npm test
      - name: Defold (Lua)
        working-directory: sdks/defold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4 && lua5.4 tests/test_purser.lua

  tooling:
    name: scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m py_compile server/*.py tools/*.py
      - run: python -m unittest discover -s server/tests
      # The names are a secret (masked in logs; a variable would be printed with the step), and
      # only the files that match are listed, never the matching lines.
      - name: No personal infrastructure in the repository
        env:
          PRIVATE_NAMES_RE: ${{ secrets.PRIVATE_NAMES_RE }}
        run: |
          if [ -z "$PRIVATE_NAMES_RE" ]; then
            echo "::notice::Repository secret PRIVATE_NAMES_RE is not set: skipping the check"; exit 0
          fi
          if git grep -l -iE "$PRIVATE_NAMES_RE" -- . ':!*.lock'; then
            echo "::error::Replace personal infrastructure with placeholders in the files above"; exit 1
          fi
