name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: server

jobs:
  core:
    name: purser-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo test -p purser-core --locked

  module:
    name: module tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      # Builds spacetimedb-core (vendored OpenSSL, v8): slow on the first run, cached afterwards.
      - run: cargo test -p purser --locked

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo build -p purser --target wasm32-unknown-unknown --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: purser.wasm
          path: server/target/wasm32-unknown-unknown/release/purser.wasm

  admin-ui:
    name: admin page build is up to date
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/admin-ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/admin-ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: The demo build works
        run: npm run build:demo
      - name: The committed page matches the sources
        run: git diff --exit-code -- ../spacetimedb/admin/index.html ../spacetimedb/admin/csp.txt || { echo "::error::Run 'npm run build' in server/admin-ui and commit server/spacetimedb/admin/index.html and csp.txt"; exit 1; }

  tooling:
    name: scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile server/*.py tools/*.py
      - name: No personal infrastructure in the repository
        env:
          PRIVATE_NAMES_RE: ${{ vars.PRIVATE_NAMES_RE }}
        run: |
          if [ -z "$PRIVATE_NAMES_RE" ]; then
            echo "::notice::Repository variable PRIVATE_NAMES_RE is not set: skipping the check"; exit 0
          fi
          if git grep -n -iE "$PRIVATE_NAMES_RE" -- . ':!*.lock'; then
            echo "::error::Replace personal infrastructure with placeholders"; exit 1
          fi
