[package]
name = "purser-core"
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yevhenii-sir/purser"

# Pure billing logic without SpacetimeDB dependencies: JWT signing, store response parsing,
# store notification parsing, delivery contract. Tested natively with `cargo test -p purser-core`.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
sha1 = "0.10"
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["verifying", "std"] }

[features]
# `apple::testing`: an App Store-shaped signing chain for the module's tests.
testing = []

[dev-dependencies]
rand = "0.8"
