[package]
name = "purser"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yevhenii-sir/purser"

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP handlers (`/route/...`) are still unstable in SpacetimeDB.
spacetimedb = { version = "=2.14.1", features = ["unstable"] }
purser-core = { path = "../core" }
http = "1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Native unit tests against an in-memory datastore with mocked procedure HTTP (SpacetimeDB 2.12+).
spacetimedb = { version = "=2.14.1", features = ["unstable", "test-utils"] }
# Test-only App Store key for promotional offer signatures (same version as purser-core).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
