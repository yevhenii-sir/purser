[package]
name = "purser"
version = "0.12.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yevhenii-sir/purser"

[lib]
crate-type = ["cdylib"]

[dependencies]
# HTTP handlers (`/route/...`) are still unstable in SpacetimeDB.
spacetimedb = { version = "=2.16.3", features = ["unstable"] }
purser-core = { path = "../core" }
http = "1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SATS → JSON of table rows for `access::admin_select`.
spacetimedb-sats = { version = "=2.16.3", features = ["serde"] }
# Unpacks the embedded admin page for the rare client that does not accept gzip.
miniz_oxide = "0.8"

[build-dependencies]
# The admin page is embedded gzipped (`build.rs`).
flate2 = "1"
sha2 = "0.10"

[dev-dependencies]
purser-core = { path = "../core", features = ["testing"] }
# Native unit tests against an in-memory datastore with mocked procedure HTTP (SpacetimeDB 2.12+).
spacetimedb = { version = "=2.16.3", features = ["unstable", "test-utils"] }
# Test-only App Store key for promotional offer signatures (same version as purser-core).
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
# Test-only check of signed client answers (same version as purser-core).
ed25519-dalek = { version = "2.2", default-features = false }
