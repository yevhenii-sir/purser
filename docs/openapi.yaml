openapi: 3.1.0
info:
  title: Purser HTTP API
  version: 0.13.0
  summary: Purchase verification, restore, entitlements and store notifications.
  description: |
    The public HTTP API of the billing module (`server/spacetimedb/src/handlers.rs`). It is served
    by SpacetimeDB as HTTP routes of the billing database:

    `https://<host>/v1/database/<your-billing-db>/route`

    for example `https://maincloud.spacetimedb.com/v1/database/<your-billing-db>/route` or, self-hosted,
    `https://stdb.example.com/v1/database/<your-billing-db>/route`.

    - Purchases are trusted only after the module re-queries the store. Store notification endpoints
      check the store's signature, a token the store signs (Google Play's Pub/Sub push) or a shared
      secret in the URL.
    - Client routes (everything under Purchases, Offers and paywalls, Players and Checkout) may need
      a player token: a build with `client_auth = signed` refuses requests without
      `Authorization: Bearer <HS256 JWT>` signed by the game's backend (`401`, code `ERR_CLIENT_AUTH`).
      Open builds (the default) take any `user_id`.
    - Client routes are rate limited per player and per build: `429` with `Retry-After` (seconds) and
      code `ERR_RATE_LIMITED`. Wait and retry; do not finish a purchase because of it.
    - With a response signing key, `/entitlements` and `/restore` answers carry `X-Purser-Signature`: the
      base64 Ed25519 signature of the exact body, checked with the build's public key.
    - Request bodies are JSON (the `Content-Type` header is not checked). Unknown fields are ignored.
    - Every response is JSON with a `status` string; errors also carry a `message`. Some messages start
      with an error code in brackets, such as `[ERR_CONSUMED_ELSEWHERE]`.
    - A path or method the module does not route answers `404` with a plain-text body from SpacetimeDB.
    - The admin page (`GET /admin`, HTML) is served from the same base path and is not part of this API.

    Client rules (when to finish a transaction, consume, retry) are in
    [docs/game-integration.md](https://github.com/yevhenii-sir/purser/blob/main/docs/game-integration.md).
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Server reference (server/README.md)
  url: https://github.com/yevhenii-sir/purser/blob/main/server/README.md
servers:
  - url: https://{host}/v1/database/{database}/route
    description: A billing database on maincloud or on your own SpacetimeDB server.
    variables:
      host:
        default: maincloud.spacetimedb.com
        description: SpacetimeDB host, e.g. `stdb.example.com` when self-hosted.
      database:
        default: your-billing-db
        description: Name of the billing database.
tags:
  - name: Purchases
    description: Called by the game client (or the game backend) after a purchase and on "Restore purchases".
  - name: Store notifications
    description: Called by Google Play (RTDN through Pub/Sub push) and the App Store (Server Notifications V2).
  - name: Offers and paywalls
    description: Called by the game client before showing a paywall or buying with an offer.
  - name: Players
    description: Called by the game client to describe the player on the admin page.
  - name: Checkout
    description: Web and Steam purchases the server starts (Stripe Checkout, Xsolla Pay Station, Steam MicroTxn).
  - name: Server API
    description: Called by the game's own backend with a server key (rewards, support, reading a player's purchases).
  - name: Monitoring
security:
  - {}
  - playerToken: []
paths:
  /healthz:
    get:
      tags: [Monitoring]
      operationId: healthz
      security: []
      summary: Health check
      description: |
        Answers as long as the database and its module are running, with the worker's state and queue for
        monitors. `backlog`: a purchase has been due for 15 minutes (the queue is not keeping up). `moving`: the
        server is moving to another one (docs/moving-servers.md), paused or forwarding its routes.
      responses:
        "200":
          description: The module and its worker are running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The ledger worker has not run for 5 minutes (`worker_stopped`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      tags: [Monitoring]
      operationId: metrics
      security: [{ metricsToken: [] }]
      summary: Prometheus metrics
      description: |
        Gauges in the Prometheus text format: the queue, ledger rows by build and status, store
        notifications, integration events, open alerts and today's production revenue per build.
        Off (404) until the `metrics_token` secret is set.
      responses:
        "200":
          description: The metrics.
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: A missing or wrong token.
        "404":
          description: The `metrics_token` secret is not set.

  /verify/google:
    post:
      tags: [Purchases]
      operationId: verifyGoogle
      summary: Verify a Google Play purchase
      description: |
        Looks the purchase up in the Google Play Developer API, records it in the ledger, delivers the
        reward (unless the app's delivery is `none`) and consumes / acknowledges it. Repeating the call for
        the same purchase is safe: the ledger makes it idempotent.

        `purchase_token` is required. For consumables, the purchase's `obfuscatedAccountId` must match
        `user_id` (see the account binding rule in docs/game-integration.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            example:
              app_id: com.example.mygame
              user_id: c2005b4c1622269bf51cddf038743f7f
              product_id: diamonds_150
              purchase_token: "<Google purchaseToken>"
              order_id: GPA.1234-5678-9012-34567
              price_micros: 2990000
              currency: USD
              attribution:
                appsflyer_id: 1700000000000-1234567
      responses:
        "200": { $ref: "#/components/responses/VerifyOk" }
        "202": { $ref: "#/components/responses/VerifyPending" }
        "400": { $ref: "#/components/responses/VerifyBadRequest" }
        "401": { $ref: "#/components/responses/ClientAuth" }
        "403": { $ref: "#/components/responses/VerifyForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/StoreUnavailable" }

  /verify/apple:
    post:
      tags: [Purchases]
      operationId: verifyApple
      summary: Verify an App Store purchase
      description: |
        Looks the transaction up in the App Store Server API, records it in the ledger and delivers the
        reward (unless the app's delivery is `none`). Repeating the call for the same transaction is safe.

        `order_id` (the StoreKit `transactionId`) is required. For consumables,
        the transaction's `appAccountToken` must match `user_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
            example:
              app_id: com.example.mygame
              user_id: c2005b4c1622269bf51cddf038743f7f
              product_id: month_sub
              order_id: "2000000123456789"
      responses:
        "200": { $ref: "#/components/responses/VerifyOk" }
        "202": { $ref: "#/components/responses/VerifyPending" }
        "400": { $ref: "#/components/responses/VerifyBadRequest" }
        "401": { $ref: "#/components/responses/ClientAuth" }
        "403": { $ref: "#/components/responses/VerifyForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/StoreUnavailable" }

  /verify/amazon:
    post:
      tags: [Purchases]
      operationId: verifyAmazon
      summary: Verify an Amazon Appstore purchase
      description: Looks the receipt up with the Amazon Receipt Verification Service. `order_id` (the `receiptId`) and `store_user_id` (the Amazon `userId`) are required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses: &verifyResponses
        "200": { $ref: "#/components/responses/VerifyOk" }
        "202": { $ref: "#/components/responses/VerifyPending" }
        "400": { $ref: "#/components/responses/VerifyBadRequest" }
        "401": { $ref: "#/components/responses/ClientAuth" }
        "403": { $ref: "#/components/responses/VerifyForbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/StoreUnavailable" }

  /verify/huawei:
    post:
      tags: [Purchases]
      operationId: verifyHuawei
      summary: Verify a Huawei AppGallery purchase
      description: >-
        Looks the purchase up in the Huawei IAP Order service (one-time products) or Subscription service
        (subscriptions). `purchase_token` (the `purchaseToken`) is required; subscriptions also need `order_id`
        = the `subscriptionId`. The client consumes the purchase (`consumeOwnedPurchase`) after a success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses: *verifyResponses

  /verify/samsung:
    post:
      tags: [Purchases]
      operationId: verifySamsung
      summary: Verify a Samsung Galaxy Store purchase
      description: >-
        `purchase_token` (the Samsung `purchaseId`) is required. One-time products are looked up with the Samsung IAP
        receipt API, subscriptions with the Galaxy Store Developer API's subscription status. After the grant the server
        consumes consumables and acknowledges subscriptions; with `delivery` = `none` the client consumes them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses: *verifyResponses

  /verify/meta:
    post:
      tags: [Purchases]
      operationId: verifyMeta
      summary: Verify a Meta Horizon Store (Meta Quest) purchase
      description: >-
        Checks the player's user proof (`store_user_proof`, a nonce from `Users.GetUserProof`, good for one check)
        for `store_user_id` (the Meta user id), then looks the purchase up in the Platform server-to-server APIs:
        add-ons in what the user owns now (`viewer_purchases`), subscriptions in `application/subscriptions`.
        `order_id` (the SDK's `Purchase.ID`) is optional. The server consumes consumables after the grant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses: *verifyResponses

  /verify/steam:
    post:
      tags: [Purchases]
      operationId: verifySteam
      summary: Verify a Steam purchase
      description: Finalizes and records an order started with `/checkout/steam` (`order_id` of its answer; `product_id` may be left out).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses: *verifyResponses

  /verify/stripe:
    post:
      tags: [Purchases]
      operationId: verifyStripe
      summary: Confirm a Stripe Checkout Session after the redirect
      description: "`{app_id, user_id, session_id}`. Optional: the webhook records the purchase anyway."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, session_id]
              properties:
                app_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                session_id: { type: string }
      responses: *verifyResponses

  /checkout/steam:
    post:
      tags: [Checkout]
      operationId: checkoutSteam
      summary: Start a Steam MicroTxn purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, product_id, user_id, steam_id]
              properties:
                app_id: { type: string }
                product_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                steam_id: { description: SteamID64, oneOf: [{ type: string }, { type: integer }] }
                language: { type: string }
      responses: &checkoutResponses
        "200": { $ref: "#/components/responses/Checkout" }
        "400": { description: Invalid request or product, content: { application/json: { schema: { $ref: "#/components/schemas/StatusMessage" } } } }
        "401": { $ref: "#/components/responses/ClientAuth" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/StoreUnavailable" }

  /checkout/xsolla:
    post:
      tags: [Checkout]
      operationId: checkoutXsolla
      summary: Create an Xsolla Pay Station payment token for one item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, product_id, user_id]
              properties:
                app_id: { type: string }
                product_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                sandbox: { type: boolean }
                return_url: { type: string }
                country: { type: string }
                currency: { type: string }
                language: { type: string }
                attribution: { $ref: "#/components/schemas/Attribution" }
      responses: *checkoutResponses

  /checkout/xsolla/status:
    post:
      tags: [Checkout]
      operationId: checkoutXsollaStatus
      summary: Whether an Xsolla order has been paid (from the ledger)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, order_id]
              properties:
                app_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                order_id: { type: string }
      responses: *verifyResponses

  /checkout/telegram:
    post:
      tags: [Checkout]
      operationId: checkoutTelegram
      summary: Create a Telegram Stars invoice link of the build's bot
      description: >-
        One product priced in `XTR` (Stars); subscriptions renew every 30 days. The Mini App opens `url` with
        `Telegram.WebApp.openInvoice`; `order_id` is the invoice payload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, product_id, user_id]
              properties:
                app_id: { type: string }
                product_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
      responses: *checkoutResponses

  /checkout/telegram/status:
    post:
      tags: [Checkout]
      operationId: checkoutTelegramStatus
      summary: Whether a Telegram Stars order has been paid (from the ledger; a subscription's latest period)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, order_id]
              properties:
                app_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                order_id: { type: string }
      responses: *verifyResponses

  /claim/xsolla:
    post:
      tags: [Checkout]
      operationId: claimXsolla
      summary: Move the Xsolla inventory of an old client-side login to the player
      description: >-
        The server reads the player's Xsolla inventory with their Xsolla Login token and records the build's
        non-consumables as owned (not as sales). Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, xsolla_token]
              properties:
                app_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                xsolla_token: { type: string, description: "Xsolla Login JWT of the player" }
      responses:
        "200":
          description: Items moved and skipped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  claimed:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string }
                        purchase_status: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        product_id: { type: string }
                        reason: { type: string }
        "400": { description: "Invalid input, or Xsolla refused the token (`ERR_XSOLLA_TOKEN`)." }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/StoreUnavailable" }

  /checkout/stripe:
    post:
      tags: [Checkout]
      operationId: checkoutStripe
      summary: Create a Stripe Checkout Session for one Price
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, product_id, user_id]
              properties:
                app_id: { type: string }
                product_id: { type: string, description: The Stripe Price id. }
                user_id: { $ref: "#/components/schemas/UserId" }
                success_url: { type: string }
                cancel_url: { type: string }
                attribution: { $ref: "#/components/schemas/Attribution" }
      responses: *checkoutResponses

  /manage/stripe:
    post:
      tags: [Checkout]
      operationId: manageStripe
      summary: Open the Stripe Customer Portal for the player's subscription
      description: |
        Creates a Customer Portal session for the Stripe customer of the player's newest active
        subscription of the build, where they cancel it, change the payment method and see invoices.
        The portal acts for that customer, so only builds with player tokens (`client_auth = signed`)
        get one; others answer `403 ERR_PLAYER_TOKENS_REQUIRED` (link Stripe's customer portal login
        page instead). The portal uses the account's default configuration (Stripe Dashboard → Settings
        → Billing → Customer portal); one that is not set up answers `400` with Stripe's message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, return_url]
              properties:
                app_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                return_url: { type: string, description: "Where the portal's Return link leads: https (http://localhost on builds that allow sandbox purchases)." }
      responses:
        "200":
          description: The portal session
          content:
            application/json:
              schema:
                type: object
                required: [status, url]
                properties:
                  status: { type: string, enum: [ok] }
                  url: { type: string, examples: ["https://billing.stripe.com/p/session/test_YWNjdF8x"] }
        "400": { description: "Invalid request, or the portal is not set up in Stripe", content: { application/json: { schema: { $ref: "#/components/schemas/StatusMessage" } } } }
        "401": { $ref: "#/components/responses/ClientAuth" }
        "403": { description: "ERR_PLAYER_TOKENS_REQUIRED: the build has no player tokens", content: { application/json: { schema: { $ref: "#/components/schemas/StatusMessage" } } } }
        "404": { description: "ERR_NO_SUBSCRIPTION: the player has no active Stripe subscription in this build", content: { application/json: { schema: { $ref: "#/components/schemas/StatusMessage" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "502": { $ref: "#/components/responses/StoreUnavailable" }

  /restore:
    post:
      tags: [Purchases]
      operationId: restore
      summary: Restore purchases
      description: |
        Runs the same verification as `/verify/*` for every purchase the store SDK returned on
        "Restore purchases" (the store is chosen by the app's platform), then returns the entitlements.
        Non-consumables and subscriptions restored on a new `user_id` move to it (the previous owner gets
        a `revoke` with `reason = transfer`). The call itself answers `200` even when single purchases fail:
        check `results[].http_status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreRequest"
            example:
              app_id: com.example.mygame
              user_id: c2005b4c1622269bf51cddf038743f7f
              purchases:
                - product_id: no_ads
                  purchase_token: "<Google purchaseToken>"
                - product_id: month_sub
                  purchase_token: "<Google purchaseToken>"
      responses:
        "200":
          description: Every purchase was processed; see the per-purchase results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "400":
          description: |
            Invalid JSON or missing fields, invalid `user_id`, more than 20 purchases, or an unknown /
            disabled app (`unknown app <app_id>`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: at most 20 purchases per call

  /entitlements:
    post:
      tags: [Purchases]
      operationId: entitlements
      summary: Active subscriptions and non-consumables of a player
      description: |
        Reads the ledger only (no store calls). Covers every app with the same `game_key` as `app_id`,
        so the Android and iOS builds of a game share entitlements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementsRequest"
            example:
              app_id: com.example.mygame
              user_id: c2005b4c1622269bf51cddf038743f7f
      responses:
        "200":
          description: The player's entitlements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "400":
          description: Invalid JSON or missing fields, invalid `user_id`, or an unknown / disabled app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: unknown app com.example.mygame

  /notify/google:
    post:
      tags: [Store notifications]
      operationId: notifyGoogle
      security:
        - pubSubToken: []
      summary: Google Play real-time developer notification (Pub/Sub push)
      description: |
        Endpoint of the Pub/Sub **push** subscription of the RTDN topic, with authentication on. The
        notification is used only to find the purchase: the module re-queries Google by `purchaseToken`.
        Voided purchases (refunds) are applied from the notification itself, which is why the push must
        carry Pub/Sub's token.

        Non-2xx answers make Pub/Sub retry the delivery. `200` with `status: ignored` is final (unknown
        package or product, purchase not verified by a client yet, sandbox disabled, ...).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PubSubPush"
      responses:
        "200":
          description: |
            Processed (`ok`; a test notification answers `{"status":"ok","message":"test"}`) or
            deliberately ignored (`ignored`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResult"
              examples:
                test:
                  value: { status: ok, message: test }
                ignored:
                  value: { status: ignored, message: unknown package }
        "400":
          description: The body is not a Pub/Sub push with a base64 DeveloperNotification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: push body without message.data
        "401":
          description: No token (authentication is off in the subscription). The setup check reports such notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: unauthorized
        "403":
          description: |
            The token was refused: not signed by Google, another service account or audience, expired, or
            the build has no `google_service_account_json`. The setup check reports the reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: unauthorized
        "503":
          description: |
            Google Play was unavailable, the store keys are misconfigured, or Google's token keys could not
            be fetched; Pub/Sub retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: retry later

  /notify/apple:
    post:
      tags: [Store notifications]
      operationId: notifyApple
      security: []
      summary: App Store Server Notification V2
      description: |
        Production and Sandbox URL of App Store Server Notifications **Version 2**. `signedPayload` must be
        signed by Apple (ES256, `x5c` chain up to Apple Root CA - G3), otherwise `401`. Only the bundle id
        and `transactionId` are read from it; the transaction is re-queried from the App Store Server API.

        Non-2xx answers make Apple retry the delivery. `200` with `status: ignored` is final.
      parameters:
        - name: secret
          in: query
          required: false
          description: Required only when `apple_notification_secret` is set for the app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload:
                  type: string
                  description: JWS `responseBodyV2DecodedPayload` signed by Apple.
      responses:
        "200":
          description: |
            Processed (`ok`; test notifications and notifications without a transaction answer
            `{"status":"ok","message":"no transaction"}`) or deliberately ignored (`ignored`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResult"
        "400":
          description: No `signedPayload`, or it cannot be decoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: no signedPayload
        "401":
          description: Wrong secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: unauthorized
        "503":
          description: The App Store was unavailable or the store keys are misconfigured; Apple retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusMessage"
              example:
                status: error
                message: retry later

  /notify/amazon:
    post:
      tags: [Store notifications]
      operationId: notifyAmazon
      summary: Amazon Real-Time Notifications (through Amazon SNS)
      description: "`?app=<app_id>` names the build. The SNS signature is checked; the receipt is looked up again with RVS."
      security: []
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses: &notifyResponses
        "200":
          description: Processed or ignored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationResult" }
        "401": { description: Not signed by the store or a wrong secret. }
        "503": { description: The store lookup failed; the store retries the delivery. }

  /notify/huawei:
    post:
      tags: [Store notifications]
      operationId: notifyHuawei
      summary: Huawei AppGallery server notifications (version 2 or 1)
      description: "`?app=<app_id>&secret=<huawei_notify_secret>`. The purchase is looked up again in the IAP APIs; accepted notifications are answered `{\"errorCode\": \"0\"}`."
      security: []
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
        - { name: secret, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: *notifyResponses

  /notify/samsung:
    post:
      tags: [Store notifications]
      operationId: notifySamsung
      summary: Samsung Instant Server Notifications
      description: >-
        `?app=<app_id>` (without it, the build whose app id is the notification's package name). The body is a JWT
        signed with the app's IAP key (`samsung_iap_public_key`); the purchases it names are looked up again.
      security: []
      parameters:
        - { name: app, in: query, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, description: The signed JWT. }
      responses: *notifyResponses

  /notify/telegram:
    post:
      tags: [Store notifications]
      operationId: notifyTelegram
      summary: Webhook of the build's Telegram bot
      description: >-
        `?app=<app_id>` names the build; `X-Telegram-Bot-Api-Secret-Token` must be its `telegram_webhook_secret`.
        A `pre_checkout_query` is answered in the response (`{"method": "answerPreCheckoutQuery", ...}`); a
        `successful_payment` is granted, a `refunded_payment` revoked.
      security: []
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
        - { name: X-Telegram-Bot-Api-Secret-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: *notifyResponses

  /notify/xsolla:
    post:
      tags: [Store notifications]
      operationId: notifyXsolla
      summary: Xsolla webhooks
      description: "`?app=<app_id>` names the build. Signed with the project's webhook secret (`Authorization: Signature ...`)."
      security: []
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: *notifyResponses

  /notify/stripe:
    post:
      tags: [Store notifications]
      operationId: notifyStripe
      summary: Stripe webhooks
      description: "`?app=<app_id>` names the build. `Stripe-Signature` is checked with the endpoint's signing secret."
      security: []
      parameters:
        - { name: app, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses: *notifyResponses

  /offers/apple/sign:
    post:
      tags: [Offers and paywalls]
      operationId: signApplePromotionalOffer
      summary: Sign an App Store promotional offer for a player
      description: |
        Signs a promotional offer of a subscription with the build's In-App Purchase key, bound to the
        player's `appAccountToken`. Each signature is good for one purchase attempt within 24 hours.
        See docs/apple-offers.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, product_id, offer_id, user_id]
              properties:
                app_id: { type: string, examples: [com.example.mygame] }
                product_id: { type: string, description: Subscription product id }
                offer_id: { type: string, description: Promotional offer id from App Store Connect }
                user_id: { $ref: "#/components/schemas/UserId" }
                transaction_id: { type: string, description: Optional; included in the V2 JWS }
      responses:
        "200":
          description: The signed offer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: success }
                  app_id: { type: string }
                  product_id: { type: string }
                  offer_id: { type: string }
                  key_id: { type: string }
                  nonce: { type: string, format: uuid }
                  timestamp: { type: integer, format: int64, description: Milliseconds }
                  signature: { type: string, description: Base64 DER ECDSA P-256 signature }
                  app_account_token: { type: string, format: uuid }
                  signed_offer_jws: { type: [string, "null"], description: Promotional offer V2 compact JWS; null without apple_issuer_id }
                  expires_at_ms: { type: integer, format: int64 }
        "400":
          description: Unknown, disabled or non-iOS build; the product is not a subscription; invalid ids.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
        "500":
          description: "`[ERR_OFFER_KEY]`: the In-App Purchase key is not configured."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }

  /paywall:
    post:
      tags: [Offers and paywalls]
      operationId: paywall
      summary: What to show at a placement
      description: |
        Products in order and the remote config of the placement's paywall. During an A/B test the player
        is assigned by a hash of the test id and `user_id` (without `user_id`: the first variant).
        See docs/paywalls.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, placement]
              properties:
                app_id: { type: string, description: Package / bundle id of the build. }
                placement: { type: string, description: }
                user_id: { $ref: "#/components/schemas/UserId" }
                client: { $ref: "#/components/schemas/ClientInfo" }
      responses:
        "200":
          description: The paywall for this player.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  placement: { type: string }
                  paywall_id: { type: string }
                  paywall_name: { type: string }
                  variant_id: { type: string }
                  test_id: { type: string, description: Empty when no test is running }
                  products:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        store_id: { type: string }
                        kind: { type: string, enum: [consumable, non_consumable, subscription] }
                  remote_config: { description: Any JSON set in the admin page }
                  updated_at_ms: { type: integer, format: int64 }
        "400":
          description: Unknown app or invalid input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
        "404":
          description: "`ERR_PLACEMENT_NOT_FOUND` / `ERR_PAYWALL_NOT_FOUND`: no enabled placement."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: not_found }
                  code: { type: string }
                  message: { type: string }

  /paywall/event:
    post:
      tags: [Offers and paywalls]
      operationId: paywallEvent
      summary: Report a paywall view
      description: Counted per day and variant for A/B test results. Call once per display.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, placement, variant_id, event]
              properties:
                app_id: { type: string }
                placement: { type: string }
                variant_id: { type: string }
                test_id: { type: string }
                user_id: { $ref: "#/components/schemas/UserId" }
                event: { type: string, const: view }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
        "400":
          description: "`ERR_UNKNOWN_VARIANT`, `ERR_UNKNOWN_TEST` or `ERR_BAD_EVENT`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }

  /redeem:
    post:
      tags: [Purchases]
      operationId: redeem
      summary: Redeem a promo code
      description: |
        Gives the product of one of the app's promo codes to the player, once per player, through the ledger
        like a manual grant (no revenue). Redeeming a code again answers its grant. 10 requests a minute per
        player, 600 per build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, code]
              properties:
                app_id: { type: string, description: Package / bundle id of the build. }
                user_id: { $ref: "#/components/schemas/UserId" }
                code: { type: string, description: "4-32 characters of A-Z, 0-9 and -, not case-sensitive." }
                client: { $ref: "#/components/schemas/ClientInfo" }
      responses:
        "200":
          description: Granted (`success`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
        "202":
          description: Granted, on its way to the game (`pending`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
        "404":
          description: "`ERR_CODE_INVALID`: no such code, or it is turned off."
        "409":
          description: "`ERR_CODE_EXPIRED` or `ERR_CODE_USED_UP`."
  /attributes:
    post:
      tags: [Players]
      operationId: attributes
      summary: Set custom attributes of a player
      description: |
        Attributes the game wants to see on the admin page's player profile (email, level, ...). Keys are
        `a-z`, `0-9` and `_`, up to 40 characters, at most 30 per player and build; values are strings (up to
        200 characters), numbers or booleans, stored as text; `null` or `""` removes a key. Only send what
        the player agreed to share.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, attributes]
              properties:
                app_id: { type: string, description: Package / bundle id of the build. }
                user_id: { $ref: "#/components/schemas/UserId" }
                attributes:
                  type: object
                  additionalProperties: { type: [string, number, boolean, "null"] }
                client: { $ref: "#/components/schemas/ClientInfo" }
      responses:
        "200":
          description: The player's attributes after the update.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  attributes: { type: object, additionalProperties: { type: string } }
        "400":
          description: Unknown app, invalid user id or attributes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }

  /server/entitlements:
    post:
      tags: [Server API]
      operationId: serverEntitlements
      security: [{ serverKey: [] }]
      summary: A player's customer info, for the game's backend (scope `read`)
      description: The same answer as `/entitlements`, for any player of the key's app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id]
              properties:
                app_id: { type: string, description: Any build of the key's app. }
                user_id: { type: string }
      responses:
        "200":
          description: The player's customer info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        "401": { $ref: "#/components/responses/ServerKey" }
        "403": { $ref: "#/components/responses/ServerScope" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /server/grant:
    post:
      tags: [Server API]
      operationId: serverGrant
      security: [{ serverKey: [] }]
      summary: Give a product without a store purchase (scope `grant`)
      description: |
        A reward, a compensation, a promo: the game gets `grant` like for a purchase (store `manual`,
        no revenue) and `/entitlements` lists it. Idempotent by `transaction_id`: the same request
        again answers `repeated: true`; another grant with the same id is refused with `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, user_id, product_id, transaction_id]
              properties:
                app_id: { type: string }
                user_id: { type: string }
                product_id: { type: string, description: The product id of the build `app_id`. }
                transaction_id: { type: string, description: "Your id of this grant (1-128 of A-Z a-z 0-9 - _ . :)." }
                expires_at_ms: { type: integer, format: int64, description: "Subscriptions: when access ends; 0 = never." }
                note: { type: string }
            example:
              app_id: com.example.mygame
              user_id: c2005b4c1622269bf51cddf038743f7f
              product_id: no_ads
              transaction_id: season-3-reward-c2005b4c
      responses:
        "200":
          description: Granted (or granted before by the same request).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  purchase_id: { type: string, examples: ["manual:mygame.season-3-reward-c2005b4c"] }
                  purchase_status: { type: string }
                  repeated: { type: boolean }
        "400": { description: "Invalid input (unknown product, user id)." }
        "401": { $ref: "#/components/responses/ServerKey" }
        "403": { $ref: "#/components/responses/ServerScope" }
        "409": { description: "`transaction_id` is used by another grant." }
        "429": { $ref: "#/components/responses/RateLimited" }

  /server/revoke:
    post:
      tags: [Server API]
      operationId: serverRevoke
      security: [{ serverKey: [] }]
      summary: Take a purchase back (scope `revoke`)
      description: The game gets `revoke` (reason `admin`). Not a refund; revenue does not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id, purchase_id]
              properties:
                app_id: { type: string }
                purchase_id: { type: string, description: "Ledger id `{store}:{transaction_id}`." }
                reason: { type: string }
      responses:
        "200": { description: Revoked (or revoked before). }
        "401": { $ref: "#/components/responses/ServerKey" }
        "403": { $ref: "#/components/responses/ServerScope" }
        "404": { description: Not a purchase of the key's app. }
        "409": { description: The purchase cannot be revoked in its state. }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [healthy, starting, backlog, worker_stopped, moving]
        version:
          type: string
          description: Version of the published module (`purser` crate).
          examples: ["0.9.0"]
        moving:
          type: [string, "null"]
          enum: [paused, forwarding, null]
          description: The server is moving to another one (docs/moving-servers.md); null when not.
        worker_age_secs:
          type: [integer, "null"]
          description: Seconds since the minute worker last ran (null before its first run).
        pending_purchases:
          type: integer
          description: Ledger rows the worker still has to finish, including those waiting for a later retry.
        due_purchases:
          type: integer
          description: Rows due now.
        oldest_due_secs:
          type: integer
          description: How long the oldest due row has waited (0 when none is due).
        queue_drainers:
          type: integer
          description: Queue drainers running or scheduled (at most the `worker_lanes` setting).
        stuck_purchases:
          type: integer
          description: Rows retried 3 times or more, or blocked.
        blocked_purchases:
          type: integer
          description: Rows whose step waits for a fix of the setup (a missing secret, a delivery host that is not allowed, a deleted build).
        queued_integration_events:
          type: integer
    ClientInfo:
      type: object
      description: |
        The device a request comes from, shown on the admin page's player profile with when the server first
        and last heard from the player. Optional in `/verify`, `/restore`, `/entitlements`, `/paywall` and
        `/attributes`; fields not sent keep the stored value. Each value is at most 100 characters.
      properties:
        device: { type: string, description: "Device model, e.g. Xiaomi 23117RA68G" }
        os: { type: string, description: "Operating system, e.g. Android OS 14 / API-34" }
        app_version: { type: string }
        sdk_version: { type: string, description: Version of the client SDK }

    UserId:
      type: string
      description: |
        The player's id in your game (for SpacetimeDB games, the identity hex). 1 to 128 characters:
        letters, digits, `-`, `_`, `.`, `:`.
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9._:-]{1,128}$"

    Attribution:
      type: object
      description: |
        Device and attribution ids for the integrations (AppsFlyer, Adjust, Tenjin, AppMetrica, Amplitude, Meta, Singular, Branch, Kochava, Apple Ads,
        ...). Unknown keys and invalid values are dropped; values are strings (booleans are accepted and
        turned into "true" / "false") of at most 128 characters: letters, digits, `-`, `_`, `.`, `:`.
        The server remembers the latest values per player for events without a client (renewals, refunds).
      properties:
        appsflyer_id: { type: string }
        advertising_id: { type: string, description: Android GAID }
        oaid: { type: string }
        idfa: { type: string }
        idfv: { type: string }
        att: { type: [string, boolean], description: "iOS App Tracking Transparency consent: true / false" }
        tenjin_id: { type: string, description: Tenjin analytics_installation_id }
        os_version: { type: string }
        app_version: { type: string }
        adjust_id: { type: string, description: Adjust.getAdid() }
        appmetrica_device_id: { type: string }
        amplitude_device_id: { type: string, description: Amplitude SDK device id }
        meta_anon_id: { type: string, description: "Facebook SDK anonymous id (Meta Conversions API anon_id)" }
        singular_device_id: { type: string, description: "Singular SDK device id (SDID, sdid of Singular's V2 S2S endpoint)" }
        app_set_id: { type: string, description: "Android App Set ID (Singular asid)" }
        kochava_device_id: { type: string, description: Kochava SDK device id }
        asa_org_id: { type: string }
        asa_campaign_id: { type: string }
        asa_ad_group_id: { type: string }
        asa_keyword_id: { type: string }
        asa_ad_id: { type: string }
        asa_country: { type: string }
      additionalProperties: true

    VerifyRequest:
      type: object
      required: [app_id, user_id, product_id]
      properties:
        app_id:
          type: string
          description: "The build's id (`game_app.app_id`): Android package, iOS bundle id, Steam AppID or the id of an Amazon / web build."
          examples: [com.example.mygame]
        user_id:
          $ref: "#/components/schemas/UserId"
        product_id:
          type: string
          description: Store product id, as configured on the server.
        purchase_token:
          type: string
          description: Google `purchaseToken`. Required for `/verify/google`.
        order_id:
          type: string
          description: |
            Apple `transactionId` (required for `/verify/apple`), Amazon `receiptId` (required for
            `/verify/amazon`) or Google `orderId` (optional).
        app_instance_id:
          type: string
          description: Firebase `app_instance_id` of the client, for GA4.
        price_micros:
          type: integer
          format: int64
          description: |
            Localized price shown to the player, in micros (Google does not report one-time product prices).
            Used for revenue and integrations.
        currency:
          type: string
          description: ISO 4217 code of `price_micros`.
          examples: [USD]
        attribution:
          $ref: "#/components/schemas/Attribution"
        store_user_id:
          type: string
          description: >-
            The player's id in the store: the Amazon Appstore user id (required for `/verify/amazon`, with the
            receipt id in `order_id`), the Meta user id (required for `/verify/meta`).
        store_user_proof:
          type: string
          description: >-
            Meta only (required): a nonce from `Users.GetUserProof` proving the client is `store_user_id`; good for one check.
        placement:
          type: string
          description: Paywall placement the purchase was made from (A/B test results, see `/paywall`).
        variant_id: { type: string }
        test_id: { type: string }
        paywall_id: { type: string }
        offer_id:
          type: string
          description: The store offer the player bought (Google offer or base plan id, Apple promotional offer id).
        client_finished:
          type: boolean
          description: The game finished the purchase in the store itself (observer mode); honored for builds where the client grants, so the server does not consume or acknowledge it.
        client:
          $ref: "#/components/schemas/ClientInfo"

    VerifyResult:
      type: object
      description: Result of a verification that reached the store.
      required: [status, message, transaction_id, product_id, is_sub, expires_date_ms, environment, delivery]
      properties:
        status:
          type: string
          description: |
            - `success`: the reward is granted (or, with `delivery: client`, ready to be granted by the client).
              Finish the transaction.
            - `pending`: verified and recorded; the worker delivers the reward shortly. Finish the transaction.
            - `pending_or_canceled`: the payment has not gone through (or was canceled). Retry later.
            - `expired` / `revoked`: subscription expired / purchase refunded.
            - `forbidden`: see the 403 response (also a purchase the ledger rejected).
          examples: [success, pending, pending_or_canceled, expired, revoked]
        message:
          type: string
        transaction_id:
          type: string
          description: Google `orderId` / Apple `transactionId` of the purchase (renewals included).
        product_id:
          type: string
        is_sub:
          type: boolean
        quantity:
          type: integer
          minimum: 1
          description: Units bought at once (Google Play multi-quantity, StoreKit quantity); 1 otherwise.
        expires_date_ms:
          type: integer
          format: int64
          description: Subscription expiration (Unix ms); 0 when the purchase does not expire.
        environment:
          type: string
          enum: [production, sandbox]
        delivery:
          type: string
          enum: [server, client]
          description: |
            `client` when the app has no game backend (`delivery = none`): the client grants the reward and
            only then finishes the purchase in the store (Google consume / Apple finishTransaction).

    StatusMessage:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          examples: [error, invalid, forbidden]
        message:
          type: string
        code:
          type: string
          description: An error code where the client acts on it (docs/troubleshooting.md).
          examples: [ERR_PLAYER_TOKENS_REQUIRED, ERR_NO_SUBSCRIPTION]

    NotificationResult:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok, ignored]
        message:
          type: string

    EntitlementsRequest:
      type: object
      required: [app_id, user_id]
      properties:
        app_id:
          type: string
          description: Any build of the game.
        user_id:
          $ref: "#/components/schemas/UserId"
        client:
          $ref: "#/components/schemas/ClientInfo"

    EntitlementState:
      type: object
      description: A purchase that gives access now.
      required: [product_id, store, expires_at_ms, purchased_at_ms, will_renew, in_grace, billing_issue, trial, family_shared]
      properties:
        product_id:
          type: string
          description: Catalog product id (the same in every store of the app).
        store: { type: string, examples: [google, apple, stripe] }
        expires_at_ms:
          type: integer
          format: int64
          description: When access ends (Unix ms), the store's grace period included; 0 = never.
        purchased_at_ms: { type: integer, format: int64 }
        will_renew:
          type: boolean
          description: A subscription that renews (false when auto-renew is off, and for non-consumables).
        in_grace:
          type: boolean
          description: The renewal payment failed and the store keeps access for a while (grace period).
        billing_issue:
          type: boolean
          description: The store could not charge the renewal.
        trial: { type: boolean }
        family_shared:
          type: boolean
          description: Shared by a family member (Apple Family Sharing); this player paid nothing.
        renews_to:
          type: string
          description: Catalog id of the product the next renewal switches to (a pending downgrade).

    PausedSubscription:
      type: object
      description: A subscription the player paused (Google Play); it gives no access until it resumes.
      required: [product_id, store, resumes_at_ms]
      properties:
        product_id: { type: string }
        store: { type: string, examples: [google] }
        resumes_at_ms:
          type: integer
          format: int64
          description: When it resumes by itself (Unix ms).

    Entitlements:
      type: object
      required: [user_id, game_key, access, subscriptions, paused, non_consumables, server_time_ms]
      properties:
        user_id:
          type: string
        game_key:
          type: string
          description: Shared key of the game's builds.
        access:
          type: object
          description: Access levels the player has (what the products unlock, e.g. `premium`), with the purchase that lasts longest.
          additionalProperties:
            $ref: "#/components/schemas/EntitlementState"
        subscriptions:
          type: object
          description: Subscriptions that give access now, by catalog product id.
          additionalProperties:
            $ref: "#/components/schemas/EntitlementState"
        paused:
          type: object
          description: Subscriptions the player paused, by catalog product id (no access meanwhile).
          additionalProperties:
            $ref: "#/components/schemas/PausedSubscription"
        non_consumables:
          type: array
          description: Owned non-consumable product ids.
          items:
            type: string
          examples:
            - [no_ads]
        server_time_ms:
          type: integer
          format: int64
          description: Server time (Unix ms), to compare expirations without trusting the device clock.

    RestoreRequest:
      type: object
      required: [app_id, user_id, purchases]
      properties:
        app_id:
          type: string
          description: The build the purchases come from.
        user_id:
          $ref: "#/components/schemas/UserId"
        app_instance_id:
          type: string
          description: Firebase `app_instance_id`, for GA4.
        attribution:
          $ref: "#/components/schemas/Attribution"
        client_finished:
          type: boolean
          description: As in `/verify`, for every item.
        store_user_id:
          type: string
          description: The player's id in the store for every item that does not name one (Amazon, Meta).
        store_user_proof:
          type: string
          description: Meta builds (required) - one user proof for every item.
        client:
          $ref: "#/components/schemas/ClientInfo"
        purchases:
          type: array
          maxItems: 20
          items:
            type: object
            required: [product_id]
            properties:
              product_id:
                type: string
              purchase_token:
                type: string
                description: Google `purchaseToken` (Android builds).
              order_id:
                type: string
                description: Apple `transactionId` (iOS builds).
              store_user_id:
                type: string
                description: The player's id in the store (Amazon, Meta); defaults to the request's.

    RestoreResponse:
      type: object
      required: [results, entitlements]
      properties:
        results:
          type: array
          items:
            type: object
            required: [product_id, http_status, status, message]
            properties:
              product_id:
                type: string
              http_status:
                type: integer
                description: The HTTP status `/verify/*` would have answered for this purchase.
              status:
                type: string
                description: Same values as `VerifyResult.status` and the error statuses.
              message:
                type: string
        entitlements:
          $ref: "#/components/schemas/Entitlements"

    PubSubPush:
      type: object
      description: Pub/Sub push envelope; `message.data` is the base64 `DeveloperNotification` JSON.
      required: [message]
      properties:
        message:
          type: object
          required: [data]
          properties:
            data:
              type: string
              contentEncoding: base64
            messageId:
              type: string
            publishTime:
              type: string
        subscription:
          type: string

  securitySchemes:
    pubSubToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The OIDC token Pub/Sub sends with every push of a subscription with authentication: signed by
        Google (RS256), `email` = the `client_email` of the build's `google_service_account_json`
        (verified), `aud` = `purser-rtdn:<app_id>`.
    metricsToken:
      type: http
      scheme: bearer
      description: The `metrics_token` secret (`default` scope), created on the admin page's Server page.
    serverKey:
      type: http
      scheme: bearer
      description: |
        A server key of the app (`psk_<key_id>_<secret>`), made on the admin page (app → Delivery →
        Server keys). Only for the game's backend: never ship it in a client.
    playerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Builds with `client_auth = signed`: an HS256 JWT `{"sub": <user_id>, "exp": <unix seconds>, "aud": <game_key>}`
        (`aud` required) signed with the build's `client_auth_secret` by the game's backend.

  responses:
    ServerKey:
      description: "`code: ERR_SERVER_KEY`: no server key, a malformed, unknown or revoked one."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
    ServerScope:
      description: "`code: ERR_SERVER_SCOPE`: the key lacks the scope, or the build is not one of its app."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
    ClientAuth:
      description: "`code: ERR_CLIENT_AUTH`: the build needs a player token and the request has none, an expired one or one for another player."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
          example: { status: error, code: ERR_CLIENT_AUTH, message: the player token expired }
    RateLimited:
      description: "`code: ERR_RATE_LIMITED`: too many requests for this player or build. Retry after `Retry-After` seconds."
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
          example: { status: error, code: ERR_RATE_LIMITED, message: "too many requests, retry in 10 s" }
    Checkout:
      description: The checkout answer of the store (see server/README.md for its fields).
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    VerifyOk:
      description: |
        The store answered. `status` tells the client what to do: `success`, `pending_or_canceled`,
        `expired`, `revoked` (or another ledger status, see `VerifyResult.status`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VerifyResult"
          example:
            status: success
            message: ""
            transaction_id: GPA.1234-5678-9012-34567
            product_id: diamonds_150
            is_sub: false
            quantity: 1
            expires_date_ms: 0
            environment: production
            delivery: server
    VerifyPending:
      description: Verified and recorded; the reward will be delivered by the worker. Finish the transaction.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VerifyResult"
          example:
            status: pending
            message: purchase verified, reward will be delivered shortly
            transaction_id: GPA.1234-5678-9012-34567
            product_id: diamonds_150
            is_sub: false
            quantity: 1
            expires_date_ms: 0
            environment: production
            delivery: server
    VerifyBadRequest:
      description: |
        - `status: error`: invalid JSON or missing fields, invalid `user_id`, unknown or disabled app, the app
          is on the other platform, unknown product, missing `purchase_token` (Google) / `order_id` (Apple).
        - `status: invalid`: the store does not know this purchase, or it belongs to another app or product.

        Finish the transaction for `invalid`; fix the request for `error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
          examples:
            unknownProduct:
              value: { status: error, message: unknown product diamonds_150 }
            otherApp:
              value: { status: invalid, message: transaction belongs to another app }
    VerifyForbidden:
      description: |
        `status: forbidden`. The purchase will not be granted to this player:
        the consumable is bound to another account (`purchase is bound to another account`) or already
        belongs to another player; it was consumed outside this server (`[ERR_CONSUMED_ELSEWHERE]`);
        sandbox purchases are disabled for the app. Finish the transaction.

        When the store lookup succeeded, the body also has the `VerifyResult` fields.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/VerifyResult"
              - $ref: "#/components/schemas/StatusMessage"
          example:
            status: forbidden
            message: sandbox purchases are disabled for this app
    ServerError:
      description: |
        Configuration error (for example, store keys are missing or invalid). The message is generic;
        details are in the module logs. Do not finish the transaction; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
          example:
            status: error
            message: store credentials are not configured correctly
    StoreUnavailable:
      description: The store API is temporarily unavailable. Do not finish the transaction; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StatusMessage"
          example:
            status: error
            message: store is temporarily unavailable, retry later
