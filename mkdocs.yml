site_name: Purser
site_description: Self-hosted in-app purchase billing for games and apps on SpacetimeDB, an open-source alternative to Adapty and RevenueCat.
repo_url: https://github.com/yevhenii-sir/purser
repo_name: purser
edit_uri: edit/main/docs/
copyright: MIT License

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  logo: images/purser.svg
  favicon: images/purser.svg
  features:
    # Groups of pages are sections of the sidebar; the open page's headings are a tree under it.
    - navigation.sections
    - navigation.path
    - toc.integrate
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Links from docs/ to files elsewhere in the repository (../server/README.md, ...) become GitHub links.
hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details

exclude_docs: |
  images/README.md

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - How it works: flows.md
      - Versions and upgrades: releases.md
  - Stores:
      - Store setup: store-setup.md
      - Bulk setup: bulk-setup.md
  - Your game:
      - Game integration: game-integration.md
      - SDKs for other engines: sdks.md
      - Games with their own IAP code: observer-mode.md
      - Virtual currency: wallet.md
  - Selling:
      - Paywalls and A/B tests: paywalls.md
      - App Store promotional offers: apple-offers.md
  - Revenue and alerts:
      - Revenue analytics: analytics.md
      - Purchase events in BigQuery: bigquery.md
      - Owner alerts: alerts.md
  - Running the server:
      - Self-hosting: self-hosting.md
      - Moving to another server: moving-servers.md
      - Troubleshooting: troubleshooting.md
  - Migrating:
      - From Adapty: migrating-from-adapty.md
      - From RevenueCat: migrating-from-revenuecat.md
  - Reference:
      - API reference: api.md
      - MCP server: mcp.md
      - Server reference: https://github.com/yevhenii-sir/purser/blob/main/server/README.md
      - Unity package: https://github.com/yevhenii-sir/purser/blob/main/unity/com.yevhenii.purser/README.md
